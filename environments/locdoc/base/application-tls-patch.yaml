apiVersion: apps/v1
kind: Deployment
metadata:
  name: oms
  namespace: locdoc
spec:
  template:
    spec:
      containers:
      - name: oms
        env:
        - name: DB_SSL_MODE
          value: verify-full
        - name: DB_SSL_ROOT_CERT
          value: /database-tls/ca.pem
        - name: NODE_OPTIONS
          value: --max-old-space-size=1536
        volumeMounts:
        - name: database-ca
          mountPath: /database-tls
          readOnly: true
        - name: runtime-tmp
          mountPath: /tmp
        securityContext:
          readOnlyRootFilesystem: true
      volumes:
      - name: database-ca
        secret:
          secretName: oms-db-ca
          items:
          - key: tls.crt
            path: ca.pem
      - name: runtime-tmp
        emptyDir:
          sizeLimit: 256Mi
      initContainers:
      - name: database-fixtures
        image: postgres@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
        - name: PGSSLMODE
          value: verify-full
        - name: PGSSLROOTCERT
          value: /database-tls/ca.pem
        volumeMounts:
        - name: database-ca
          mountPath: /database-tls
          readOnly: true
    metadata:
      annotations:
        locdoc/source-revision: 9f52fe03781f11943b9c7f3bb945b43dd641a64b
        locdoc/image-digest: sha256:4e4c49c0a9d101e5be487b653e90a59528e0588475d6620e188132755563a7c4
