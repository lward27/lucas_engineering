apiVersion: apps/v1
kind: Deployment
metadata:
  name: oms-postgres
  namespace: locdoc
spec:
  template:
    spec:
      containers:
      - name: postgres
        args:
        - -c
        - ssl=on
        - -c
        - ssl_cert_file=/tls/tls.crt
        - -c
        - ssl_key_file=/tls/tls.key
        - -c
        - hba_file=/database-config/pg_hba.conf
        volumeMounts:
        - name: database-tls
          mountPath: /tls
          readOnly: true
        - name: database-hba
          mountPath: /database-config
          readOnly: true
      volumes:
      - name: database-tls
        secret:
          secretName: oms-db-server
          defaultMode: 288
      - name: database-hba
        configMap:
          name: oms-db-hba
