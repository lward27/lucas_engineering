apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: oms-db-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: oms-db-ca
spec:
  isCA: true
  commonName: OMS isolated lab database CA
  secretName: oms-db-ca
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: oms-db-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: oms-db-ca
spec:
  ca:
    secretName: oms-db-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: oms-db-server
spec:
  secretName: oms-db-server
  duration: 2160h
  renewBefore: 360h
  dnsNames:
  - oms-postgres
  usages:
  - server auth
  - digital signature
  - key encipherment
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: oms-db-ca
    kind: Issuer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oms-db-hba
data:
  pg_hba.conf: 'local all all trust

    hostssl all all 0.0.0.0/0 scram-sha-256

    hostssl all all ::/0 scram-sha-256

    hostnossl all all 0.0.0.0/0 reject

    hostnossl all all ::/0 reject

    '
