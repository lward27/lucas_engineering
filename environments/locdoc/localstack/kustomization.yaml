apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: localstack
resources:
- ../base
patches:
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: oms
      namespace: locdoc
    spec:
      template:
        spec:
          containers:
          - name: oms
            env:
            - name: AWS_ENDPOINT_URL_S3
              value: http://localstack:4566
            - name: AWS_ENDPOINT_URL
              value: http://localstack:4566
            - name: AWS_BUCKET_NAME
              value: locdoc-oms-localstack-documents
