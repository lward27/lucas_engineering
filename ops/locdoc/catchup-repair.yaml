    -- AlterTable
    ALTER TABLE "work_order" DROP COLUMN "quotedFirstViewedDate",
    ADD COLUMN     "quoteApprovedBy_id" VARCHAR(36),
    ADD COLUMN     "quoteFirstViewedDate" TIMESTAMP(3),
