    ALTER COLUMN "exteriorPhoto" SET DATA TYPE TEXT,
    ALTER COLUMN "doorEdgePhoto" SET DATA TYPE TEXT,
    ALTER COLUMN "frameEdgePhoto" SET DATA TYPE TEXT;

    -- AlterTable
    ALTER TABLE "product" ADD COLUMN     "sync_id" VARCHAR(36),
    ALTER COLUMN "productDescription" SET DATA TYPE TEXT;

    -- AlterTable
    ALTER TABLE "purchase_order_detail" ADD COLUMN     "sync_id" VARCHAR(36);

    -- AlterTable
    ALTER TABLE "service" ADD COLUMN     "sync_id" VARCHAR(36),
    ALTER COLUMN "serviceDescription" SET DATA TYPE TEXT;

