apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oms-objects
  namespace: locdoc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 5Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oms-object-store
  namespace: locdoc
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: oms-object-store}
  template:
    metadata:
      labels:
        app: oms-object-store
        app.kubernetes.io/part-of: oms
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: minio
          image: cgr.dev/chainguard/minio@sha256:e70b2b1e74d79457f808710483bd726ff364529ca30736eaa15a6ab547d3a5a7
          args: [server, /data, --address, ':9000', --console-address, ':9001']
          env:
            - {name: MINIO_ROOT_USER, value: locdoc-mock}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: oms-secrets, key: postgres-password}}
            - {name: MINIO_BROWSER, value: 'off'}
          ports: [{name: s3, containerPort: 9000}]
          readinessProbe: {httpGet: {path: /minio/health/ready, port: s3}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /minio/health/live, port: s3}, initialDelaySeconds: 15, periodSeconds: 20}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: oms-objects}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: oms-object-store, namespace: locdoc}
spec:
  selector: {app: oms-object-store}
  ports: [{name: s3, port: 9000, targetPort: s3}]
