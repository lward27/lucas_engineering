apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - postgres.yaml
  - object-store.yaml
  - mailpit.yaml
  - stripe-mock.yaml
  - payment-mock-config.yaml
  - payment-mock.yaml
  - seclock-mock-config.yaml
  - seclock-mock.yaml
  - maps-mock-config.yaml
  - maps-mock.yaml
  - network-policy.yaml
  - oms.yaml
patches:
  - target:
      version: v1
      kind: PersistentVolumeClaim
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
