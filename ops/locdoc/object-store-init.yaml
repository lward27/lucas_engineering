apiVersion: batch/v1
kind: Job
metadata: {name: oms-object-store-init, namespace: locdoc}
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: oms}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: initialize
          image: registry.lucas.engineering/locdoc-oms@sha256:224c093bc0ffa8167e5a1aefaa9f2597f18988a3afdee71e65cb7ba20307f75a
          command: [node, --input-type=module, -e]
          args:
            - |
              import { S3Client, CreateBucketCommand, HeadBucketCommand } from '@aws-sdk/client-s3';
              const client = new S3Client({endpoint: process.env.AWS_ENDPOINT_URL_S3, forcePathStyle: true, region: 'us-east-1'});
              for (let n = 0; n < 30; n++) {
                try {
                  try { await client.send(new HeadBucketCommand({Bucket: 'oms-local'})); }
                  catch (e) { if (e.$metadata?.httpStatusCode !== 404) throw e; await client.send(new CreateBucketCommand({Bucket: 'oms-local'})); }
                  console.log('Mock bucket ready'); process.exit(0);
                } catch (e) { if (n === 29) throw e; await new Promise(r => setTimeout(r, 2000)); }
              }
          env:
            - {name: AWS_ENDPOINT_URL_S3, value: 'http://oms-object-store:9000'}
            - {name: AWS_ACCESS_KEY_ID, value: locdoc-mock}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: oms-secrets, key: postgres-password}}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
