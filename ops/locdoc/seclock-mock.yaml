apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: oms-seclock-mock, namespace: locdoc}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: oms-seclock-mock, namespace: locdoc}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: oms-seclock-mock}}
  template:
    metadata:
      annotations: {locdoc.example/mock-revision: "3"}
      labels: {app: oms-seclock-mock, app.kubernetes.io/part-of: oms}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: mock
          image: python:3.12-alpine
          command: [python, -u, /app/server.py]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 20}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: code, mountPath: /app, readOnly: true}, {name: data, mountPath: /data}]
      volumes:
        - name: code
          configMap: {name: oms-seclock-mock}
        - name: data
          persistentVolumeClaim: {claimName: oms-seclock-mock}
---
apiVersion: v1
kind: Service
metadata: {name: oms-seclock-mock, namespace: locdoc}
spec:
  selector: {app: oms-seclock-mock}
  ports: [{name: http, port: 8080, targetPort: http}]
