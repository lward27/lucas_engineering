apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oms-postgres
  namespace: locdoc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oms-postgres
  namespace: locdoc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: oms-postgres
  template:
    metadata:
      labels:
        app: oms-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: oms_test
            - name: POSTGRES_USER
              value: oms
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oms-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, oms, -d, oms_test]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: oms-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: oms-postgres
  namespace: locdoc
spec:
  selector:
    app: oms-postgres
  ports:
    - port: 5432
      targetPort: 5432
