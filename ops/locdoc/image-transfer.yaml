apiVersion: v1
kind: Pod
metadata:
  name: locdoc-image-transfer
  namespace: tekton-pipelines
  labels: {app.kubernetes.io/part-of: locdoc-image-transfer}
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  activeDeadlineSeconds: 3600
  containers:
    - name: skopeo
      image: quay.io/skopeo/stable:v1.18.0
      command: [sh, -c, 'sleep 3500']
      resources:
        requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 2Gi}
        limits: {memory: 1Gi, ephemeral-storage: 4Gi}
      volumeMounts:
        - {name: work, mountPath: /work}
        - {name: registry-auth, mountPath: /auth, readOnly: true}
        - {name: registry-ca, mountPath: /certs, readOnly: true}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
  volumes:
    - name: work
      emptyDir: {sizeLimit: 3Gi}
    - name: registry-auth
      secret: {secretName: lucas-registry-push}
    - name: registry-ca
      secret: {secretName: registry-internal-ca}
