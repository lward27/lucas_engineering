alloy:
  alloy:
    enableReporting: false
    mounts:
      varlog: true
    configMap:
      content: |
        discovery.kubernetes "kubernetes_pods" {
          role = "pod"
          namespaces {
            names = ["apps-prod"]
          }
          selectors {
            role  = "pod"
            field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
          }
        }
        loki.process "kubernetes_pods" {
          forward_to = [loki.write.default.receiver]
          stage.cri { }
        }
        discovery.relabel "kubernetes_pods" {
          targets = discovery.kubernetes.kubernetes_pods.targets
          rule {
            source_labels = ["__meta_kubernetes_pod_controller_name"]
            regex         = "([0-9a-z-.]+?)(-[0-9a-f]{8,10})?"
            target_label  = "__tmp_controller_name"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app", "__tmp_controller_name", "__meta_kubernetes_pod_name"]
            regex         = "^;*([^;]+)(;.*)?$"
            target_label  = "app"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance", "__meta_kubernetes_pod_label_instance"]
            regex         = "^;*([^;]+)(;.*)?$"
            target_label  = "instance"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component", "__meta_kubernetes_pod_label_component"]
            regex         = "^;*([^;]+)(;.*)?$"
            target_label  = "component"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node_name"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["namespace", "app"]
            separator     = "/"
            target_label  = "job"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            target_label  = "__path__"
            replacement   = "/var/log/pods/*$1/*.log"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash", "__meta_kubernetes_pod_annotation_kubernetes_io_config_hash", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            regex         = "true/(.*)"
            target_label  = "__path__"
            replacement   = "/var/log/pods/*$1/*.log"
          }
        }
        loki.source.file "kubernetes_pods" {
          targets    = discovery.relabel.kubernetes_pods.output
          forward_to = [loki.process.kubernetes_pods.receiver]
          file_match {
            enabled = true
          }
          legacy_positions_file = "/tmp/alloy/positions.yaml"
        }
        discovery.kubernetes "openclaw" {
          role = "pod"
          namespaces {
            names = ["apps-prod"]
          }
          selectors {
            role  = "pod"
            field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
          }
        }
        loki.process "openclaw" {
          forward_to = [loki.write.default.receiver]
          stage.regex {
            expression = "^\\S+ \\[(?P<component>[^\\]]+)\\] .+ (?P<method>[a-zA-Z][\\w.]+) (?P<duration>\\d+ms)"
          }
          stage.labels {
            values = {
              component = null,
              method    = null,
            }
          }
        }
        discovery.relabel "openclaw" {
          targets = discovery.kubernetes.openclaw.targets
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            regex         = "openclaw"
            action        = "keep"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            target_label  = "__path__"
            replacement   = "/var/log/pods/*$1/*.log"
          }
          rule {
            target_label = "app"
            replacement  = "openclaw"
          }
        }
        loki.source.file "openclaw" {
          targets    = discovery.relabel.openclaw.output
          forward_to = [loki.process.openclaw.receiver]
          file_match {
            enabled = true
          }
          legacy_positions_file = "/tmp/alloy/positions.yaml"
        }
        loki.write "default" {
          endpoint {
            url = "http://loki-gateway.monitoring.svc.cluster.local:80/loki/api/v1/push"
          }
          external_labels = {
            collector = "alloy-canary",
          }
        }
  rbac:
    create: true
    namespaces:
      - apps-prod
    rules:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list", "watch"]
    clusterRules: []
  crds:
    create: false
  controller:
    type: daemonset
    nodeSelector:
      kubernetes.io/hostname: ubuntu-lucas-engineering-2
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
  service:
    enabled: false
