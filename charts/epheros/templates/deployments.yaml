apiVersion: apps/v1
kind: Deployment
metadata:
  name: epheros-web
  namespace: epheros
  labels:
{{ include "epheros.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.replicaCount.web }}
  selector:
    matchLabels: { app.kubernetes.io/name: epheros-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: epheros-web, app.kubernetes.io/part-of: epheros }
    spec:
      serviceAccountName: epheros-web
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: epheros-web }
      containers:
        - name: web
          image: {{ include "epheros.image" .Values.images.web | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8001 }]
          env:
            - { name: EPHEROS_AUTH_MODE, value: cloudflare }
            - { name: EPHEROS_APP_ENV, value: cluster }
            - { name: EPHEROS_PUBLIC_ORIGIN, value: {{ .Values.auth.publicOrigin | quote }} }
            - { name: EPHEROS_OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.observability.otlpEndpoint | quote }} }
            - { name: EPHEROS_CSRF_SECRET, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.app }}, key: csrf-secret } } }
          envFrom: [{ secretRef: { name: {{ .Values.secrets.app }} } }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 20 }
          resources:
{{ toYaml .Values.resources.web | indent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epheros-api
  namespace: epheros
  labels:
{{ include "epheros.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels: { app.kubernetes.io/name: epheros-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: epheros-api, app.kubernetes.io/part-of: epheros }
    spec:
      serviceAccountName: epheros-api
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: epheros-api }
      containers:
        - name: api
          image: {{ include "epheros.image" .Values.images.api | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: EPHEROS_AUTH_MODE, value: cloudflare }
            - { name: EPHEROS_APP_ENV, value: cluster }
            - { name: EPHEROS_REPOSITORY, value: postgres }
            - { name: EPHEROS_DATABASE_URL, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.database }}, key: database-url } } }
            - { name: EPHEROS_PUBLIC_ORIGIN, value: {{ .Values.auth.publicOrigin | quote }} }
            - { name: EPHEROS_OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.observability.otlpEndpoint | quote }} }
            - { name: EPHEROS_CSRF_SECRET, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.app }}, key: csrf-secret } } }
          envFrom: [{ secretRef: { name: {{ .Values.secrets.app }} } }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 20 }
          resources:
{{ toYaml .Values.resources.api | indent 12 }}
