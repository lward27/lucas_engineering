apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: epheros-web
  namespace: epheros
  labels:
{{ include "epheros.labels" . | indent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: epheros-web }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: epheros-api
  namespace: epheros
  labels:
{{ include "epheros.labels" . | indent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: epheros-api }
