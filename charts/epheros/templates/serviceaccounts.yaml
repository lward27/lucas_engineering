apiVersion: v1
kind: ServiceAccount
metadata:
  name: epheros-web
  namespace: epheros
  labels:
{{ include "epheros.labels" . | indent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: epheros-backup
  namespace: epheros
  labels:
{{ include "epheros.labels" . | indent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: epheros-api
  namespace: epheros
  labels:
{{ include "epheros.labels" . | indent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: epheros-migrate
  namespace: epheros
  annotations:
    # The migration Job is a PreSync hook, so its ServiceAccount must exist
    # before Argo begins the hook phase rather than during normal sync.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
  labels:
{{ include "epheros.labels" . | indent 4 }}
automountServiceAccountToken: false
