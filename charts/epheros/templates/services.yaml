apiVersion: v1
kind: Service
metadata:
  name: epheros-web
  namespace: epheros
  labels:
{{ include "epheros.labels" . | indent 4 }}
spec:
  selector: { app.kubernetes.io/name: epheros-web }
  ports:
    - { name: http, port: 8001, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: epheros-api
  namespace: epheros
  labels:
{{ include "epheros.labels" . | indent 4 }}
spec:
  selector: { app.kubernetes.io/name: epheros-api }
  ports:
    - { name: http, port: 8000, targetPort: http }

