apiVersion: batch/v1
kind: Job
metadata:
  name: epheros-migrate
  namespace: epheros
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
{{ include "epheros.labels" . | indent 4 }}
spec:
  backoffLimit: 2
  template:
    metadata: { labels: { app.kubernetes.io/name: epheros-migrate, app.kubernetes.io/part-of: epheros } }
    spec:
      restartPolicy: Never
      serviceAccountName: epheros-migrate
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: {{ include "epheros.image" .Values.images.api | quote }}
          command: ["alembic", "upgrade", "head"]
          env:
            - { name: EPHEROS_DATABASE_URL, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.migrationDatabase }}, key: database-url } } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
