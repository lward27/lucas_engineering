images:
  web:
    repository: registry.lucas.engineering/epheros-web
    digest: "sha256:3551ef9d78815567f11dcdcfbe759103beb39f77be5be3be8958908f40c4706f"
  api:
    repository: registry.lucas.engineering/epheros-api
    digest: "sha256:800d9b62ff8f7d503168a0bb8db1acb10d3152fe213d76cf94c8a558718a2997"
replicaCount: { web: 2, api: 2 }
# Retirement preparation must not run the database migration hook.
# Review the retained database before enabling migrations during any restoration.
migration: { enabled: false }
secrets:
  app: epheros-app-config
  database: epheros-db-app
  migrationDatabase: epheros-db-owner
  backup: epheros-db-backup
database: { host: postgresql.apps-prod.svc.cluster.local, port: 5432, name: epheros }
# Cloudflare issuer, audience, JWKS, and CSRF material are supplied only by
# the out-of-band epheros-app-config Secret; never commit them here.
auth: { publicOrigin: "https://epheros.lucas.engineering" }
observability:
  otlpEndpoint: "opentelemetry-collector.monitoring.svc.cluster.local:4317"
ingress: { host: epheros.lucas.engineering, className: nginx, tlsSecretName: epheros-lucas-engineering-tls }
backup:
  enabled: false
  schedule: "17 2 * * *"
  s3Endpoint: ""
  bucket: ""
resources:
  web:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 250m, memory: 256Mi }
  api:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: 500m, memory: 512Mi }
