apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-frontend
spec:
  template:
    spec:
      containers:
        - name: finance-frontend
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/runtime-config.json
              subPath: runtime-config.json
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: runtime-config
          configMap:
            name: finance-runtime-config
        - name: nginx-config
          configMap:
            name: finance-frontend-nginx
