server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /runtime-config.json {
        add_header Cache-Control "no-store" always;
        default_type application/json;
        try_files $uri =503;
    }

    # finance-db and yfinance have no public hostnames; the browser reaches
    # them only through these paths, limited to the methods the UI uses.
    location /api/database/ {
        limit_except GET DELETE { deny all; }
        proxy_pass http://finance-app-database-service.apps-prod.svc.cluster.local:8091/;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location /api/yfinance/ {
        limit_except GET { deny all; }
        proxy_pass http://yfinance-wrapper.apps-prod.svc.cluster.local:8090/;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
