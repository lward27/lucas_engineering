apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: epheros-ci-webhook
  namespace: {{ .Values.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls: [{ hosts: [epheros-ci-webhooks.lucas.engineering], secretName: epheros-ci-webhooks-tls }]
  rules:
    - host: epheros-ci-webhooks.lucas.engineering
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: el-epheros-ci, port: { number: 8080 } }

