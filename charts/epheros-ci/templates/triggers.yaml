apiVersion: v1
kind: ServiceAccount
metadata:
  name: epheros-ci-triggers
  namespace: {{ .Values.namespace }}
  labels: { app.kubernetes.io/name: epheros-ci, app.kubernetes.io/part-of: epheros }
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: epheros-ci-trigger
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [tekton.dev]
    resources: [pipelineruns]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: epheros-ci-trigger
  namespace: {{ .Values.namespace }}
subjects: [{ kind: ServiceAccount, name: epheros-ci-triggers }]
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: epheros-ci-trigger }
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: epheros-ci-push
  namespace: {{ .Values.namespace }}
spec:
  params:
    - { name: repo-url, value: $(body.repository.clone_url) }
    - { name: source-sha, value: $(body.after) }
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: epheros-ci-push
  namespace: {{ .Values.namespace }}
spec:
  params:
    - { name: repo-url }
    - { name: source-sha }
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: epheros-build-
        namespace: {{ .Values.namespace }}
      spec:
        pipelineRef: { name: epheros-build-promote }
        serviceAccountName: epheros-ci
        params:
          - { name: repo-url, value: $(tt.params.repo-url) }
          - { name: source-sha, value: $(tt.params.source-sha) }
        workspaces:
          - name: shared-data
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources: { requests: { storage: 8Gi } }
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: epheros-ci
  namespace: {{ .Values.namespace }}
spec:
  serviceAccountName: epheros-ci-triggers
  triggers:
    - name: github-push
      interceptors:
        - ref: { name: github }
          params:
            - { name: secretRef, value: { secretName: github-webhook-secret, secretKey: secret } }
            - { name: eventTypes, value: [push] }
        - ref: { name: cel }
          params:
            - name: filter
              value: >-
                body.repository.full_name == 'JenaSys/epheros-platform' &&
                body.ref == 'refs/heads/main'
      bindings: [{ ref: epheros-ci-push }]
      template: { ref: epheros-ci-push }
