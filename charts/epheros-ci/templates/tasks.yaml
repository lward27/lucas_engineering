apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: epheros-python-verify
  namespace: {{ .Values.namespace }}
spec:
  workspaces: [{ name: source }]
  steps:
    - name: verify
      image: python:3.13-slim-bookworm@sha256:67a1e1f215ccda113cfc024e8639049257e88f273898f595b61476d128d387e8
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install --no-cache-dir --require-hashes -q -r requirements-dev.txt
        pip check
        ruff check --exclude .venv packages services tools migrations
        mypy packages services tools
        pytest -q
        python -m compileall -q packages services migrations tools
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: epheros-source-supply-chain
  namespace: {{ .Values.namespace }}
spec:
  workspaces: [{ name: source }]
  results:
    - name: sbom-sha256
      description: SHA-256 of the source SPDX JSON SBOM
  steps:
    - name: sbom-and-scan
      image: aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        mkdir -p .epheros-ci-artifacts
        trivy fs --quiet --format spdx-json --output .epheros-ci-artifacts/source.sbom.spdx.json .
        trivy fs --quiet --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
        sha256sum .epheros-ci-artifacts/source.sbom.spdx.json | awk '{print $1}' > $(results.sbom-sha256.path)
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: epheros-web-verify
  namespace: {{ .Values.namespace }}
spec:
  workspaces: [{ name: source }]
  steps:
    - name: verify
      image: node:24-bookworm-slim@sha256:3638d9a6fe4030bd716be989438248074489337ba3275657f93595428be4fc03
      workingDir: $(workspaces.source.path)/apps/web-ui
      script: |
        #!/bin/sh
        set -eu
        corepack enable
        pnpm install --frozen-lockfile --config.strictDepBuilds=false
        pnpm typecheck
        pnpm test -- --run
        pnpm build
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: epheros-browser-verify
  namespace: {{ .Values.namespace }}
spec:
  workspaces: [{ name: source }]
  steps:
    - name: verify
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      workingDir: $(workspaces.source.path)/apps/web-ui
      script: |
        #!/bin/sh
        set -eu
        corepack enable
        pnpm install --frozen-lockfile --config.strictDepBuilds=false
        pnpm test:e2e
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: epheros-image-supply-chain
  namespace: {{ .Values.namespace }}
spec:
  params:
    - { name: image, type: string }
    - { name: digest, type: string }
    - { name: artifact-name, type: string }
  workspaces: [{ name: source }]
  results:
    - name: sbom-sha256
      description: SHA-256 of the image SPDX JSON SBOM
  volumes:
    - name: registry-auth
      secret: { secretName: {{ .Values.secrets.registryAuth }} }
  steps:
    - name: sbom-and-scan
      image: aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
      workingDir: $(workspaces.source.path)
      volumeMounts: [{ name: registry-auth, mountPath: /root/.docker, readOnly: true }]
      script: |
        #!/bin/sh
        set -eu
        mkdir -p .epheros-ci-artifacts
        image_ref="$(params.image)@$(params.digest)"
        sbom=".epheros-ci-artifacts/$(params.artifact-name).sbom.spdx.json"
        trivy image --quiet --format spdx-json --output "${sbom}" "${image_ref}"
        trivy image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${image_ref}"
        sha256sum "${sbom}" | awk '{print $1}' > $(results.sbom-sha256.path)
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: epheros-gitops-pr
  namespace: {{ .Values.namespace }}
spec:
  params:
    - { name: gitops-repo, type: string }
    - { name: source-sha, type: string }
    - { name: web-digest, type: string }
    - { name: api-digest, type: string }
  workspaces: [{ name: source }]
  steps:
    - name: open-pr
      image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
      workingDir: $(workspaces.source.path)
      env:
        - name: GITHUB_TOKEN
          valueFrom: { secretKeyRef: { name: {{ .Values.secrets.gitopsBot }}, key: token } }
      script: |
        #!/bin/sh
        set -eu
        apk add --no-cache curl git >/dev/null
        branch="epheros/$(params.source-sha)"
        git -c http.extraHeader="Authorization: Bearer ${GITHUB_TOKEN}" clone "https://github.com/$(params.gitops-repo).git" .gitops
        cd .gitops
        git checkout -b "${branch}"
        sed -i "/^  web:/,/^  api:/ s#^    digest:.*#    digest: \"$(params.web-digest)\"#" charts/epheros/values.yaml
        sed -i "/^  api:/,/^replicaCount:/ s#^    digest:.*#    digest: \"$(params.api-digest)\"#" charts/epheros/values.yaml
        git config user.name epheros-ci
        git config user.email epheros-ci@users.noreply.github.com
        git add charts/epheros/values.yaml
        git commit -m "chore(epheros): promote $(params.source-sha)"
        git -c http.extraHeader="Authorization: Bearer ${GITHUB_TOKEN}" push origin "${branch}"
        payload="{\"title\":\"Promote Epheros $(params.source-sha)\",\"head\":\"${branch}\",\"base\":\"main\",\"body\":\"Tekton verification passed. Review the immutable web and API digests before merge.\"}"
        curl --fail-with-body -sS -X POST -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" "https://api.github.com/repos/$(params.gitops-repo)/pulls" -d "${payload}"
