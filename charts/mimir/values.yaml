mimir-distributed:
  # Keep the whole cluster on one supported stable patch release. The upstream
  # chart default is 3.0.4, but 3.0.9 is the latest available 3.0 patch.
  image:
    tag: 3.0.9
  # MinIO credentials live in the out-of-Git Secret mimir-minio (keys
  # rootUser/rootPassword) and reach the config via -config.expand-env. The
  # name must match the MinIO fullname: the chart's make-minio-buckets Job
  # mounts that Secret by name regardless of minio.existingSecret.
  global:
    extraEnv:
      - name: MINIO_ROOT_USER
        valueFrom:
          secretKeyRef:
            name: mimir-minio
            key: rootUser
      - name: MINIO_ROOT_PASSWORD
        valueFrom:
          secretKeyRef:
            name: mimir-minio
            key: rootPassword
  mimir:
    structuredConfig:
      # Every component needs the same object store. A filesystem backend on
      # per-component local-path PVCs left the compactor and store-gateway
      # blind to ingester blocks, so they piled up on the ingester volume.
      # Credentials are repeated per storage section because the chart's
      # MinIO defaults set them there and would override common.storage.
      common:
        storage:
          backend: s3
          s3:
            endpoint: mimir-minio.monitoring.svc:9000
            insecure: true
            access_key_id: ${MINIO_ROOT_USER}
            secret_access_key: ${MINIO_ROOT_PASSWORD}
      blocks_storage:
        backend: s3
        s3:
          bucket_name: mimir-tsdb
          endpoint: mimir-minio.monitoring.svc:9000
          insecure: true
          access_key_id: ${MINIO_ROOT_USER}
          secret_access_key: ${MINIO_ROOT_PASSWORD}
        bucket_store:
          sync_dir: /data/tsdb-sync
      ruler_storage:
        backend: s3
        s3:
          bucket_name: mimir-ruler
          endpoint: mimir-minio.monitoring.svc:9000
          insecure: true
          access_key_id: ${MINIO_ROOT_USER}
          secret_access_key: ${MINIO_ROOT_PASSWORD}
      alertmanager_storage:
        backend: s3
        s3:
          bucket_name: mimir-ruler
          endpoint: mimir-minio.monitoring.svc:9000
          insecure: true
          access_key_id: ${MINIO_ROOT_USER}
          secret_access_key: ${MINIO_ROOT_PASSWORD}
      # Separate data dirs so none overlap with blocks_storage.filesystem.dir
      compactor:
        data_dir: /data/compactor
      ruler:
        rule_path: /data/ruler
      alertmanager:
        data_dir: /data/alertmanager
      # Disable Kafka-based ingest storage — use classic push path instead
      ingest_storage:
        enabled: false
      ingester:
        push_grpc_method_enabled: true
        ring:
          replication_factor: 1
      limits:
        max_global_series_per_user: 10000000
        compactor_blocks_retention_period: 14d
      store_gateway:
        sharding_ring:
          replication_factor: 1
  minio:
    enabled: true
    existingSecret: mimir-minio
    persistence:
      size: 20Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

  # Disable Kafka - not needed for a single-node deployment
  kafka:
    enabled: false

  # Disable zone-aware replication and use minimal replicas
  ingester:
    zoneAwareReplication:
      enabled: false
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi
  store_gateway:
    zoneAwareReplication:
      enabled: false
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi

  compactor:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi

  distributor:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi

  querier:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi

  query_frontend:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 128Mi

  query_scheduler:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 128Mi

  ruler:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 128Mi

  alertmanager:
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        memory: 64Mi

  overrides_exporter:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        memory: 64Mi

  rollout_operator:
    enabled: false
