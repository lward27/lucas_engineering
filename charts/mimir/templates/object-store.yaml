{{- with .Values.objectStore }}
{{- if .enabled }}
# Upstream MinIO images are no longer published (Docker Hub repo removed,
# Quay requires auth), and the chart's MinIO subchart needs a shell entrypoint,
# so this runs Chainguard's MinIO build directly.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mimir-minio
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: mimir-minio
    app.kubernetes.io/part-of: mimir
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .storageClassName }}
  resources:
    requests:
      storage: {{ .size }}
---
apiVersion: v1
kind: Service
metadata:
  name: mimir-minio
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: mimir-minio
    app.kubernetes.io/part-of: mimir
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  selector:
    app.kubernetes.io/name: mimir-minio
  ports:
    - name: http-s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir-minio
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: mimir-minio
    app.kubernetes.io/part-of: mimir
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir-minio
        app.kubernetes.io/part-of: mimir
    spec:
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: {{ .image }}
          args: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .credentialsSecret }}
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .credentialsSecret }}
                  key: rootPassword
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: public
            - name: MINIO_BROWSER
              value: "off"
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mimir-minio
        - name: tmp
          emptyDir: {}
---
# Mimir does not create buckets, so this hook must finish before the
# Mimir components (wave 0) roll onto the S3 backend.
apiVersion: batch/v1
kind: Job
metadata:
  name: mimir-minio-buckets
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: mimir-minio-buckets
    app.kubernetes.io/part-of: mimir
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir-minio-buckets
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: {{ .clientImage }}
          args:
            - mb
            - --ignore-existing
            {{- range .buckets }}
            - local/{{ . }}
            {{- end }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .credentialsSecret }}
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .credentialsSecret }}
                  key: rootPassword
            - name: MC_HOST_local
              value: http://$(MINIO_ROOT_USER):$(MINIO_ROOT_PASSWORD)@mimir-minio.{{ $.Release.Namespace }}.svc:9000
            - name: MC_CONFIG_DIR
              value: /tmp/mc
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}
