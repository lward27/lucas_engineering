namespace: tekton-pipelines

registry:
  host: registry.lucas.engineering
  buildArgs: []

# GitHub webhook secret - must be pre-created as a K8s Secret in the tekton-pipelines
# namespace before deploying this chart. Example:
#   kubectl create secret generic github-webhook-secret \
#     --from-literal=secret=<your-webhook-secret> \
#     -n tekton-pipelines
github:
  webhookSecretName: github-webhook-secret
  webhookSecretKey: secret

webhookIngress:
  host: tekton-webhooks.lucas.engineering
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    cert-manager.io/private-key-rotation-policy: "Never"
    cert-manager.io/revision-history-limit: "2147483647"
  tls:
    enabled: true
    secretName: tekton-webhooks-lucas-engineering-tls

# One entry per microservice. Each service gets its own TriggerBinding,
# TriggerTemplate, and a route in the EventListener.
services:
  pharness-runtime:
    # PHarness releases are built only by the reviewed immutable-SHA release
    # workflow. The push webhook must not publish a mutable tag or restart the
    # digest-pinned Deployment.
    enabled: false
    repoName: pharness
    repoURL: https://github.com/lward27/pharness.git
    branch: main
    imageRef: registry.lucas.engineering/pharness-runtime
    dockerfile: "./deploy/docker/Dockerfile.runtime"
    context: "./"
    deployment: ""
    deploymentNamespace: pharness
    workspaceStorageSize: 8Gi

  pharness-ui:
    # The UI follows the same reviewed source SHA and digest-pinning release
    # commit as the API and Python runner.
    enabled: false
    repoName: pharness
    repoURL: https://github.com/lward27/pharness.git
    branch: main
    imageRef: registry.lucas.engineering/pharness-ui
    dockerfile: "./deploy/docker/Dockerfile.ui"
    context: "./"
    deployment: ""
    deploymentNamespace: pharness
    workspaceStorageSize: 1Gi

  finance-app-db-service:
    enabled: true
    repoName: finance_app_database_service
    repoURL: https://github.com/lward27/finance_app_database_service.git
    branch: main
    imageRef: registry.lucas.engineering/finance_app_database_service:latest
    deployment: finance-app-database-service
    deploymentNamespace: apps-prod
    workspaceStorageSize: 1Gi

  finance-frontend:
    # PHarness owns digest-pinned staging and approved production promotion.
    # Use pharness-finance-frontend-build; source pushes must not restart production.
    enabled: false
    repoName: finance-frontend
    repoURL: https://github.com/lward27/finance-frontend.git
    branch: main
    imageRef: registry.lucas.engineering/finance-frontend
    deployment: ""
    deploymentNamespace: apps-prod
    workspaceStorageSize: 1Gi

  yfinance-wrapper:
    # PHarness owns this release path. The push webhook must not build a mutable
    # tag or restart production; use pharness-yfinance-build explicitly.
    enabled: false
    repoName: yfinance_wrapper
    repoURL: https://github.com/lward27/yfinance_wrapper.git
    branch: main
    imageRef: registry.lucas.engineering/yfinance_wrapper
    deployment: ""
    deploymentNamespace: apps-prod
    workspaceStorageSize: 1Gi

  scraper-manager:
    enabled: true
    repoName: scraper_manager
    repoURL: https://github.com/lward27/scraper_manager.git
    branch: main
    imageRef: registry.lucas.engineering/scraper_manager:latest
    deployment: scraper-manager-scheduler,scraper-manager-worker
    deploymentNamespace: apps-prod
    workspaceStorageSize: 1Gi

  forge-platform:
    enabled: true
    repoName: forge
    repoURL: https://github.com/lward27/forge.git
    branch: main
    imageRef: registry.lucas.engineering/forge_platform:latest
    dockerfile: "./platform/Dockerfile"
    context: "./platform/"
    deployment: forge-platform
    deploymentNamespace: forge-platform
    workspaceStorageSize: 1Gi

  forge-admin:
    enabled: true
    repoURL: https://github.com/lward27/forge-admin.git
    branch: main
    imageRef: registry.lucas.engineering/forge_admin:latest
    deployment: forge-admin
    deploymentNamespace: forge-platform
    workspaceStorageSize: 1Gi

  forge-portal:
    enabled: true
    repoURL: https://github.com/lward27/forge-portal.git
    branch: main
    imageRef: registry.lucas.engineering/forge_portal:latest
    deployment: forge-portal
    deploymentNamespace: forge-platform
    workspaceStorageSize: 1Gi

  data-log-visual-frontend:
    enabled: true
    repoURL: https://github.com/lward27/data-log-visual.git
    branch: main
    imageRef: registry.lucas.engineering/data-log-visual-frontend:latest
    dockerfile: "./frontend/Dockerfile"
    context: "./frontend/"
    deployment: data-log-visual-frontend
    deploymentNamespace: apps-prod
    workspaceStorageSize: 1Gi

  data-log-visual-backend:
    enabled: true
    repoURL: https://github.com/lward27/data-log-visual.git
    branch: main
    imageRef: registry.lucas.engineering/data-log-visual-backend:latest
    dockerfile: "./backend/Dockerfile"
    context: "./backend/"
    deployment: data-log-visual-backend
    deploymentNamespace: apps-prod
    workspaceStorageSize: 1Gi

  escape-backend:
    enabled: true
    repoName: Escape_V1_back
    repoURL: https://github.com/ClsDevTeam/Escape_V1_back.git
    branch: migration-validation-functions
    imageRef: registry.lucas.engineering/escape-v1-back:latest
    deployment: escape-backend
    deploymentNamespace: escape
    workspaceStorageSize: 1Gi

  escape-frontend:
    enabled: true
    repoName: ESCape-V1-Front
    repoURL: https://github.com/ClsDevTeam/ESCape-V1-Front.git
    branch: main
    imageRef: registry.lucas.engineering/escape-v1-front:latest
    deployment: escape-frontend
    deploymentNamespace: escape
    workspaceStorageSize: 1Gi
    buildArgs:
      - VITE_API_BASE_URL=https://escape-api.lucas.engineering/api/
      - VITE_DEFAULT_DATABASE=cls
