---
# ServiceAccount used by pipeline task pods (git-clone, kaniko)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-ci-pipeline-sa
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: tekton-ci
---
# Build-only PipelineRuns use this unprivileged identity when no rollout Task is
# needed. Keep the existing rollout-capable identity for webhook pipelines.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-ci-build
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: tekton-ci
automountServiceAccountToken: false
---
# ServiceAccount used by the EventListener pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-ci-triggers-sa
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: tekton-ci
---
# Allow the triggers SA to create PipelineRuns and read trigger resources
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-ci-triggers-role
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: tekton-ci
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["triggers.tekton.dev"]
    resources:
      - eventlisteners
      - triggerbindings
      - triggertemplates
      - triggers
      - interceptors
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.github.webhookSecretName }}
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames:
      - tekton-ci-pipeline-sa
    verbs: ["impersonate"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
# Allow the pipeline SA to restart deployments after builds
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tekton-ci-rollout-restart
  labels:
    app.kubernetes.io/part-of: tekton-ci
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]
---
# The upstream EventListener ClusterRole also grants secrets get/list/watch
# cluster-wide. This chart only needs cluster-scoped Trigger bindings and
# interceptors; the webhook Secret is scoped separately in the namespaced Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tekton-ci-triggers-clusterrefs
  labels:
    app.kubernetes.io/part-of: tekton-ci
rules:
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["clustertriggerbindings", "clusterinterceptors"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-ci-rollout-restart-binding
  labels:
    app.kubernetes.io/part-of: tekton-ci
subjects:
  - kind: ServiceAccount
    name: tekton-ci-pipeline-sa
    namespace: {{ .Values.namespace }}
  - kind: ServiceAccount
    name: default
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-ci-rollout-restart
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-ci-triggers-namespaced-binding
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: tekton-ci
subjects:
  - kind: ServiceAccount
    name: tekton-ci-triggers-sa
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-ci-triggers-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-ci-triggers-clusterrefs-binding
  labels:
    app.kubernetes.io/part-of: tekton-ci
subjects:
  - kind: ServiceAccount
    name: tekton-ci-triggers-sa
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-ci-triggers-clusterrefs
