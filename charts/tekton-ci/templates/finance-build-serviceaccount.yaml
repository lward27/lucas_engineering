apiVersion: v1
kind: ServiceAccount
metadata:
  name: pharness-finance-build
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: tekton-ci
    pharness.dev/release-path: hosted-sdlc
# Git clone and BuildKit need no Kubernetes API access. Secret volumes are
# mounted by the kubelet; this identity has no rollout or other RBAC binding.
automountServiceAccountToken: false
