{{- if (index .Values.apps "locdoc").enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: locdoc
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lward27/lucas_engineering.git
    path: ops/locdoc
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: locdoc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
