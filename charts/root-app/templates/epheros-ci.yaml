{{- if (index .Values.apps "epheros-ci").enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: epheros-ci
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lward27/lucas_engineering.git
    path: charts/epheros-ci
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: tekton-pipelines
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
{{- end }}
