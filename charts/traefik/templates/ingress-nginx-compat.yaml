# The remotely managed Cloudflare tunnel still targets the old ingress-nginx
# Service name. Remove this file (and the namespace with it) once the tunnel
# origins point at traefik.traefik.svc.cluster.local.
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
spec:
  type: ExternalName
  externalName: traefik.traefik.svc.cluster.local
