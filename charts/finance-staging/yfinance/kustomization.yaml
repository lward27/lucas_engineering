apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps-staging
resources:
  - ../../yfinance-wrapper
  - network-policy.yaml
images:
  - name: registry.lucas.engineering/yfinance_wrapper
    digest: sha256:0e1ff0551004128140f48e06c79f98cc288a96aacaa22587b5c795bcd21c328a
patches:
  - path: deployment-patch.yaml
  # Staging uses its own yfinance-staging policy.
  - target:
      kind: NetworkPolicy
      name: yfinance-wrapper
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: yfinance-wrapper
