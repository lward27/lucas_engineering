apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps-staging
resources:
  - ../../yfinance-wrapper
  - network-policy.yaml
images:
  - name: registry.lucas.engineering/yfinance_wrapper
    digest: sha256:32e269b5d5b9eed559f0b8ea8ac56ed5c449d3dd0f875f698b6d1b0b2f328d2b
patches:
  - path: deployment-patch.yaml
  # Staging uses its own yfinance-staging policy.
  - target:
      kind: NetworkPolicy
      name: yfinance-wrapper
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: yfinance-wrapper
