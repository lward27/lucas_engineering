server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This also blocks compiled production URLs in the pre-M11 frontend image.
    add_header Content-Security-Policy "connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /runtime-config.json {
        add_header Cache-Control "no-store" always;
        default_type application/json;
        try_files $uri =503;
    }

    location /api/yfinance/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://yfinance-wrapper.apps-staging.svc.cluster.local:8090/;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }

    # No database or scraper is bound in this staging slice.
    location /api/ { return 503; }
    location / { try_files $uri $uri/ /index.html; }
}
