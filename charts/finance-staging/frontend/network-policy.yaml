apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finance-frontend-staging
spec:
  podSelector:
    matchLabels:
      app: finance-frontend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pharness
      ports:
        - {protocol: TCP, port: 80}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app: yfinance-wrapper
      ports:
        - {protocol: TCP, port: 8000}
