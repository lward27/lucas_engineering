apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-frontend
spec:
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: finance-frontend
          volumeMounts:
            - name: staging-nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /runtime-config.json
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
      volumes:
        - name: staging-nginx
          configMap:
            name: finance-staging-nginx
