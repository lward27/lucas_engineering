docker-registry:
  image:
    repository: docker.io/library/registry
    tag: 3.1.2@sha256:1290056e2357eceb0c047cb60ae9abb370305a218e2df650eb8d3ea021b1c151
  configPath: /etc/distribution
  # Return relative upload URLs so authenticated in-cluster clients preserve
  # the gateway's non-default :8443 authority across resumable blob uploads.
  configData:
    http:
      relativeurls: true
  service:
    type: ClusterIP
    # The authenticated gateway proxies to this stable backend address.
    clusterIP: 10.43.146.139
  ingress:
    # The first-party Ingress now targets the authenticated gateway.
    enabled: false
    className: nginx
    hosts:
      - registry.lucas.engineering
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      cert-manager.io/cluster-issuer: letsencrypt-prod
      cert-manager.io/private-key-rotation-policy: "Never"
      cert-manager.io/revision-history-limit: "2147483647"
    tls:
    - hosts:
      - registry.lucas.engineering
      secretName: registry-lucas-engineering-tls
    className: nginx
  persistence:
    enabled: true
    existingClaim: docker-registry-data
    size: 100Gi
  # The data claim is node-local on the builder; never run two registry pods
  # against different storage during a rollout.
  updateStrategy:
    type: Recreate
  nodeSelector:
    kubernetes.io/hostname: ubuntu-lucas-engineering-build
  tolerations:
    - key: workload
      operator: Equal
      value: build
      effect: NoSchedule
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

# Builder-node NVMe claim that replaces the chart's original 10Gi claim on the
# control-plane node (whose disk is nearly full).
registryData:
  claimName: docker-registry-data
  storageClass: local-path
  size: 100Gi

# Flip this only after the internal TLS NodePort has passed authenticated push
# tests. It moves the public Ingress behind the method-aware gateway and
# applies the backend/gateway NetworkPolicies in the same GitOps sync.
registryGateway:
  enforceWrites: true
  # In-cluster builders still authenticate at the gateway; this list only
  # grants network reachability to the TLS write endpoint.
  internalWriterNamespaces:
    - tekton-pipelines
