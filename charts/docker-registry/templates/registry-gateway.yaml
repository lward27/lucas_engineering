apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-write-gateway
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;

    events { worker_connections 1024; }

    http {
      access_log /dev/stdout;
      error_log /dev/stderr warn;
      client_max_body_size 0;
      proxy_request_buffering off;
      proxy_buffering off;

      server {
        listen 8080;
        listen 8443 ssl;
        server_name registry.lucas.engineering;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /healthz { return 200 "ok\n"; }

        location /v2/ {
          limit_except GET HEAD {
            auth_basic "Registry write access";
            auth_basic_user_file /etc/nginx/auth/htpasswd;
          }

          # Preserve the internal :8443 authority so registry upload Location
          # responses do not redirect in-cluster builders to default port 443.
          proxy_set_header Host $http_host;
          proxy_set_header X-Forwarded-Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_http_version 1.1;
          proxy_pass http://docker-registry:5000;
        }

        location / { return 404; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-write-gateway
  namespace: {{ .Release.Namespace }}
  labels: &gatewayLabels
    app.kubernetes.io/name: registry-write-gateway
    app.kubernetes.io/part-of: docker-registry
spec:
  replicas: 2
  selector:
    matchLabels: *gatewayLabels
  template:
    metadata:
      labels: *gatewayLabels
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: *gatewayLabels
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
          command: ["/usr/sbin/nginx"]
          args: ["-c", "/etc/nginx-custom/nginx.conf", "-g", "daemon off;"]
          ports:
            - { name: ingress, containerPort: 8080, protocol: TCP }
            - { name: internal-tls, containerPort: 8443, protocol: TCP }
          readinessProbe:
            httpGet: { path: /healthz, port: ingress }
          livenessProbe:
            httpGet: { path: /healthz, port: ingress }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/nginx-custom, readOnly: true }
            - { name: auth, mountPath: /etc/nginx/auth, readOnly: true }
            - { name: tls, mountPath: /etc/nginx/tls, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
      volumes:
        - name: config
          configMap:
            name: registry-write-gateway
        - name: auth
          secret:
            secretName: registry-write-auth
            defaultMode: 0440
            items:
              - { key: auth, path: htpasswd }
        - name: tls
          secret:
            secretName: registry-internal-tls
            defaultMode: 0440
        - { name: tmp, emptyDir: { sizeLimit: 16Mi } }
        - { name: cache, emptyDir: { sizeLimit: 16Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: registry-write-gateway
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: registry-write-gateway
  ports:
    - name: ingress
      port: 8080
      targetPort: ingress
      protocol: TCP
    - name: internal-tls
      port: 8443
      targetPort: internal-tls
      nodePort: 32443
      protocol: TCP
{{- if .Values.registryGateway.enforceWrites }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docker-registry
  namespace: {{ .Release.Namespace }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    cert-manager.io/private-key-rotation-policy: "Never"
    cert-manager.io/revision-history-limit: "2147483647"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  rules:
    - host: registry.lucas.engineering
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: registry-write-gateway
                port:
                  name: ingress
  tls:
    - hosts: [registry.lucas.engineering]
      secretName: registry-lucas-engineering-tls
{{- end }}
