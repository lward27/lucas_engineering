{{- if .Values.registryGateway.enforceWrites }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docker-registry-gateway-only
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: docker-registry
      release: docker-registry
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: registry-write-gateway
      ports:
        - { protocol: TCP, port: 5000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry-write-gateway
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: registry-write-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { protocol: TCP, port: 8080 }
    - from:
        - ipBlock:
            cidr: 192.168.50.145/32
        {{- range .Values.registryGateway.internalWriterNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 8443 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: docker-registry
              release: docker-registry
      ports:
        - { protocol: TCP, port: 5000 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- end }}
