{{- if not .Values.probe.namespace }}
{{- range $index := until (int .Values.slots.count) }}
{{- $ns := include "campus-lab.slotName" (dict "root" $ "index" (add1 $index)) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "campus-lab.labels" $ | nindent 4 }}
    {{ $.Values.slots.labLabel.key }}: {{ $.Values.slots.labLabel.value | quote }}
    {{ $.Values.slots.slotLabelKey }}: {{ $ns }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
{{ include "campus-lab.slotGuardrails" (dict "root" $ "namespace" $ns) }}
{{- end }}
---
# The Campus control plane namespace. Admin-owned so that the controller and
# terminal identities exist before the Campus API is deployed into it.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.campusApi.namespace }}
  labels:
    {{- include "campus-lab.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# The identity the Campus controller runs as. It owns nothing outside the
# slots and can only read the qualified RuntimeClass cluster-wide. Its token
# is projected only into the Campus API container.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.controller.serviceAccount.name }}
  namespace: {{ .Values.controller.serviceAccount.namespace }}
  labels:
    {{- include "campus-lab.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# The identity of Campus browser terminals. It holds only the per-slot
# pharness-campus-terminal Role and nothing cluster-wide.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.terminal.serviceAccount.name }}
  namespace: {{ .Values.terminal.serviceAccount.namespace }}
  labels:
    {{- include "campus-lab.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# Filled in by the token controller; no credential is stored in Git.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.terminal.tokenSecretName }}
  namespace: {{ .Values.terminal.serviceAccount.namespace }}
  labels:
    {{- include "campus-lab.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ .Values.terminal.serviceAccount.name }}
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pharness-campus-controller-runtime
  labels:
    {{- include "campus-lab.labels" . | nindent 4 }}
rules:
  # Read-only, and only the qualified RuntimeClass: the controller refuses a
  # launch when it is missing or differs from the expected handler and pool.
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    resourceNames: [{{ .Values.runtime.className | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pharness-campus-controller-runtime
  labels:
    {{- include "campus-lab.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pharness-campus-controller-runtime
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controller.serviceAccount.name }}
    namespace: {{ .Values.controller.serviceAccount.namespace }}
{{- end }}
