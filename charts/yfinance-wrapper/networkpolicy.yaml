apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yfinance-wrapper
spec:
  podSelector:
    matchLabels:
      app: yfinance-wrapper
  policyTypes: [Ingress]
  ingress:
    # Scraper jobs, the frontend nginx (/api/yfinance/), pharness-api's
    # read-only release probes, and the operator-run market backfill Job
    # (ops/finance-backfill).
    - from:
        - podSelector:
            matchLabels:
              app: scraper-manager
        - podSelector:
            matchLabels:
              app: finance-frontend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pharness
          podSelector:
            matchLabels:
              app: pharness-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: finance-market-backfill
      ports:
        - protocol: TCP
          port: 8000
