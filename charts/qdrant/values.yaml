image:
  repository: docker.io/qdrant/qdrant
  tag: v1.14.1
  digest: sha256:419d72603f5346ee22ffc4606bdb7beb52fcb63077766fab678e6622ba247366
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

service:
  type: ClusterIP
  selector:
    app: qdrant
  httpPort: 6333
  grpcPort: 6334

persistence:
  size: 4Gi
  storageClass: local-path

config:
  # Qdrant configuration overrides
  storage:
    # Use memory-mapped storage for efficiency
    storage_type: mmap
  service:
    # Enable REST API
    http_port: 6333
    # Enable gRPC
    grpc_port: 6334
  # Log level
  log_level: INFO
