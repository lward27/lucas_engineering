apiVersion: v1
kind: Service
metadata:
  name: finance-app-database-service
spec:
  selector:
    app: finance-app-database-service
  ports:
  - protocol: "TCP"
    port: 8091
    targetPort: 8000
  type: ClusterIP

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-app-database-service
spec:
  selector:
    matchLabels:
      app: finance-app-database-service
  replicas: 1
  template:
    metadata:
      labels:
        app: finance-app-database-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      containers:
      - name: finance-app-database-service
        image: registry.lucas.engineering/finance_app_database_service@sha256:dfda532b4916fd31e0ecf82e13f87c595dcedb9c70b18d4ef45ac11bc7c302b8
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 12
        env:
        - name: PGHOST
          value: "postgresql.apps-prod.svc.cluster.local"
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: "finance_app"
        - name: PGUSER
          value: "finance_app_user"
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-auth
              key: postgres-password
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: finance-app-database-service-env
              key: DATABASE_URL
              optional: true
        - name: FINANCE_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: finance-app-database-service-auth
              key: FINANCE_SERVICE_TOKEN
        - name: FINANCE_GUEST_RATE_LIMIT_KEY
          valueFrom:
            secretKeyRef:
              name: finance-app-database-service-auth
              key: FINANCE_GUEST_RATE_LIMIT_KEY
        - name: FINANCE_ALLOWED_ORIGINS
          value: "https://finance.lucas.engineering"
        - name: FINANCE_GAMES_ENABLED
          value: "false"
        - name: OTEL_SERVICE_NAME
          value: "finance-app-database-service"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://opentelemetry-collector.monitoring.svc.cluster.local:4317"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"
        - name: OTEL_LOGS_EXPORTER
          value: "otlp"
        - name: OTEL_METRICS_EXPORTER
          value: "otlp"
        - name: OTEL_TRACES_EXPORTER
          value: "otlp"
        - name: OTEL_PYTHON_LOG_CORRELATION
          value: "true"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "deployment.environment=production,service.namespace=apps-prod"
        ports:
        - containerPort: 8000

---

# Processes accepted game advances. Idle while FINANCE_GAMES_ENABLED=false, but
# the flag does not stop it; scale to 0 to pause queue processing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-app-database-advance-worker
spec:
  selector:
    matchLabels:
      app: finance-app-database-advance-worker
  replicas: 1
  template:
    metadata:
      labels:
        app: finance-app-database-advance-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      containers:
      - name: advance-worker
        image: registry.lucas.engineering/finance_app_database_service@sha256:dfda532b4916fd31e0ecf82e13f87c595dcedb9c70b18d4ef45ac11bc7c302b8
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        command: ["opentelemetry-instrument", "python", "-m", "finance_app_database_service.advance_worker", "--execute"]
        env:
        - name: PGHOST
          value: "postgresql.apps-prod.svc.cluster.local"
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: "finance_app"
        - name: PGUSER
          value: "finance_app_user"
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-auth
              key: postgres-password
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: finance-app-database-service-env
              key: DATABASE_URL
              optional: true
        - name: FINANCE_GAMES_ENABLED
          value: "false"
        - name: OTEL_SERVICE_NAME
          value: "finance-app-database-advance-worker"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://opentelemetry-collector.monitoring.svc.cluster.local:4317"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"
        - name: OTEL_LOGS_EXPORTER
          value: "otlp"
        - name: OTEL_METRICS_EXPORTER
          value: "otlp"
        - name: OTEL_TRACES_EXPORTER
          value: "otlp"
        - name: OTEL_PYTHON_LOG_CORRELATION
          value: "true"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "deployment.environment=production,service.namespace=apps-prod"
