apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finance-app-database-service
spec:
  podSelector:
    matchLabels:
      app: finance-app-database-service
  policyTypes: [Ingress]
  ingress:
    # Scraper writes scraped data; the frontend nginx proxies /api/database/.
    - from:
        - podSelector:
            matchLabels:
              app: scraper-manager
        - podSelector:
            matchLabels:
              app: finance-frontend
      ports:
        - protocol: TCP
          port: 8000

---

# Restrict both finance workloads to the current in-cluster service dependencies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finance-app-database-service-egress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - finance-app-database-service
          - finance-app-database-advance-worker
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps-prod
          podSelector:
            matchLabels:
              app: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: opentelemetry-collector
              app.kubernetes.io/name: opentelemetry-collector
              component: standalone-collector
      ports:
        - protocol: TCP
          port: 4317

---

# Service port 8090 is translated to the wrapper Pod's TCP/8000 backend before
# this cluster's egress NetworkPolicy check; allow the backend port here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finance-app-database-advance-worker-egress
spec:
  podSelector:
    matchLabels:
      app: finance-app-database-advance-worker
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps-prod
          podSelector:
            matchLabels:
              app: yfinance-wrapper
      ports:
        - protocol: TCP
          port: 8000

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finance-app-database-advance-worker-ingress
spec:
  podSelector:
    matchLabels:
      app: finance-app-database-advance-worker
  policyTypes: [Ingress]

---

# Standard NetworkPolicy has no FQDN matching; preserve Google OIDC HTTPS while
# documenting that this permits any IPv4 TCP/443 destination for the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finance-app-database-service-https-egress
spec:
  podSelector:
    matchLabels:
      app: finance-app-database-service
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
