apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finance-app-database-service
spec:
  podSelector:
    matchLabels:
      app: finance-app-database-service
  policyTypes: [Ingress]
  ingress:
    # Scraper writes scraped data; the frontend nginx proxies /api/database/.
    - from:
        - podSelector:
            matchLabels:
              app: scraper-manager
        - podSelector:
            matchLabels:
              app: finance-frontend
      ports:
        - protocol: TCP
          port: 8000

---

# These allow-lists are additive with the API ingress policy above. Service
# dependencies are restricted to their current pod selectors and app ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finance-app-database-service-egress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - finance-app-database-service
          - finance-app-database-advance-worker
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps-prod
          podSelector:
            matchLabels:
              app: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: opentelemetry-collector
              app.kubernetes.io/name: opentelemetry-collector
              component: standalone-collector
      ports:
        - protocol: TCP
          port: 4317

---

# The advance worker calls the in-cluster finance wrapper on port 8090.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finance-app-database-advance-worker-egress
spec:
  podSelector:
    matchLabels:
      app: finance-app-database-advance-worker
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps-prod
          podSelector:
            matchLabels:
              app: yfinance-wrapper
      ports:
        - protocol: TCP
          port: 8090

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finance-app-database-advance-worker-ingress
spec:
  podSelector:
    matchLabels:
      app: finance-app-database-advance-worker
  policyTypes: [Ingress]

---

# Standard NetworkPolicy has no FQDN match. Retain the API's Google OIDC HTTPS
# capability with the documented residual permission to any IPv4 TCP/443 host.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finance-app-database-service-https-egress
spec:
  podSelector:
    matchLabels:
      app: finance-app-database-service
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
